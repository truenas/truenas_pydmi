[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "truenas_pydmi"
version = "0.1.0"
description = "DMI / SMBIOS introspection for TrueNAS"
requires-python = ">=3.13"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # flake8-async
    "ASYNC",
    # flake8-tidy-imports
    "TID",
    # isort
    "I",
]
ignore = [
    # Async function definition with a `timeout` parameter
    "ASYNC109",
    # Prefer absolute imports over relative imports from parent modules
    "TID252",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
